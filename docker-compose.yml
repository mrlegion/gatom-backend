services:

  gatom_db:
    container_name: gatom_db
    image: postgres:17.7-bookworm
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - gatom_pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - gatom_network

volumes:
  gatom_pg_data:

networks:
  gatom_network:
